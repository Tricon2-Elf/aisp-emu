name: Build and Test

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore aisp.sln

      - name: Build
        run: dotnet build aisp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test aisp.sln --configuration Release --no-build --verbosity normal
