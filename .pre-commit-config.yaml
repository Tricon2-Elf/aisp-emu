# Staged files only: pre-commit passes matching staged paths as arguments to `entry`.
# Install: pip install pre-commit && pre-commit install
# See https://csharpier.com/docs/Pre-commit
repos:
  - repo: local
    hooks:
      - id: dotnet-tool-restore
        name: Install .NET tools
        entry: dotnet tool restore
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        description: Restore tools from repo-root dotnet-tools.json

      - id: csharpier
        name: CSharpier (staged files only)
        entry: dotnet tool run csharpier format
        language: system
        stages: [pre-commit]
        files: \.(cs|csx|csproj|props|targets)$
        description: Format only staged C# / MSBuild-related files
