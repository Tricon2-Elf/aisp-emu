services:
  server:
    build:
      context: .
      dockerfile: aisp.Server/Dockerfile
    ports:
      - "8080:8080"     # HTTP health ( /health, /healthz )
      - "50050:50050"   # Auth
      - "50052:50052"   # Msg
      - "50054:50054"   # Area
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_EnableDiagnostics=0
      - DOTNET_ThreadPool_UnfairSemaphoreSpinLimit=0
      - DOTNET_ThreadPool_ForceMinWorkerThreads=4
      - DOTNET_ThreadPool_ForceMaxWorkerThreads=32
      - Server__MaxConcurrentClients=32
      - Server__PacketChannelCapacity=512
      - Server__MaxReceiveFrameSize=4096
      - Server__ClientReadTimeoutSeconds=300
      - Server__ClientSendTimeoutSeconds=30
      - Server__TcpNoDelay=true
      - Server__TcpKeepAlive=true
      - Server__TcpKeepAliveIdleSeconds=45
      - Server__TcpKeepAliveIntervalSeconds=10
      - Server__TcpKeepAliveRetryCount=3
      - Server__UseDistributedSessionPresence=false
      - IP_OVERRIDE=host.docker.internal
      - Server__DbOptions__ConnectionString=Data Source=/data/main.db;Cache=Shared;Default Timeout=5
      - ApiSettings__ApiKey=${AISPEMU_API_KEY:?set AISPEMU_API_KEY}
      - PortalBackend__ServiceToken=${AISPEMU_PORTAL_SERVICE_TOKEN:?set AISPEMU_PORTAL_SERVICE_TOKEN}
    volumes:
      - /opt/aisp-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    # Host tip: add 1-2GB swap on the VPS so brief login spikes are less likely to OOM-kill the container.
