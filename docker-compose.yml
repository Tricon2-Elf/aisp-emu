services:
  server:
    build:
      context: .
      dockerfile: AISpace.Server/Dockerfile
    ports:
      - "8080:8080"     # HTTP health ( /health, /healthz )
      - "50050:50050"   # Auth
      - "50052:50052"   # Msg
      - "50054:50054"   # Area
    environment:
      - IP_OVERRIDE=host.docker.internal
      - Server__DbOptions__ConnectionString=Data Source=/data/main.db
    volumes:
      - /opt/aisp-data:/data
    restart: unless-stopped